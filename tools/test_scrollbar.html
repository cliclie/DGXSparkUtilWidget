<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>clear comparison</title>
<style>
html, body { margin:0; padding:0; height:100%; background:#333; }
.panel { height:100%; width:300px; overflow-y:scroll; background:#eee; float:left; }
.panel > div { height:80px; }
/* BOTH: 40px wide scrollbar, RED track, GREEN 8px thumb. Look at where green starts from top. */
.a::-webkit-scrollbar{width:40px;background:#000}
.a::-webkit-scrollbar-track{background:#ff0000;margin-top:48px;margin-bottom:4px}
.a::-webkit-scrollbar-thumb{width:8px;background:#00ff00}
.b::-webkit-scrollbar{width:40px;background:#000}
.b::-webkit-scrollbar-track{background:#ff0000;border:4px solid #00ffff;border-top:48px solid #ff00ff}
.b::-webkit-scrollbar-thumb{width:8px;background:#00ff00}
</style>
</head>
<body>
<div class="panel a"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div><div>7</div><div>8</div><div>9</div><div>10</div><div>11</div><div>12</div></div>
<div class="panel b"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div><div>7</div><div>8</div><div>9</div><div>10</div><div>11</div><div>12</div></div>
</body>
</html>
